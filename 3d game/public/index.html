<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
canvas { display: block; }

#lobby {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  z-index: 100;
}
#lobby h1 { font-size: 3rem; margin-bottom: 8px; letter-spacing: 2px; }
#lobby p.sub { color: #aaa; margin-bottom: 30px; font-size: 1.1rem; }
#lobby input {
  padding: 12px 20px; font-size: 1.1rem; border: 2px solid #555;
  background: rgba(255,255,255,0.1); color: #fff; border-radius: 6px;
  outline: none; width: 250px; text-align: center; margin-bottom: 16px;
}
#lobby input:focus { border-color: #3498db; }
#lobby button {
  padding: 12px 40px; font-size: 1.1rem; background: #3498db;
  color: #fff; border: none; border-radius: 6px; cursor: pointer;
  transition: background 0.2s;
}
#lobby button:hover { background: #2980b9; }

#hud { display: none; }
#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 20px; height: 20px; pointer-events: none; z-index: 10;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.8);
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
#crosshair .dot {
  position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%;
  top: 50%; left: 50%; transform: translate(-50%,-50%);
}

#health-bar {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  width: 200px; height: 20px; background: rgba(0,0,0,0.6); border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.2); overflow: hidden; z-index: 10;
}
#health-fill {
  height: 100%; width: 100%; background: linear-gradient(90deg, #e74c3c, #2ecc71);
  transition: width 0.3s; border-radius: 8px;
}
#health-text {
  position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
  font-size: 0.85rem; color: #ccc; z-index: 10; pointer-events: none;
}

#scoreboard {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.85); border-radius: 10px; padding: 20px 30px;
  min-width: 350px; display: none; z-index: 50;
}
#scoreboard h2 { text-align: center; margin-bottom: 12px; font-size: 1.3rem; }
#scoreboard table { width: 100%; border-collapse: collapse; }
#scoreboard th { text-align: left; padding: 4px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; color: #aaa; }
#scoreboard td { padding: 4px 8px; font-size: 0.95rem; }
#scoreboard .name-cell { display: flex; align-items: center; gap: 8px; }
#scoreboard .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

#kill-feed {
  position: fixed; top: 60px; right: 20px; z-index: 10; pointer-events: none;
  display: flex; flex-direction: column; gap: 4px; width: 280px;
}
.kill-msg {
  background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 4px;
  font-size: 0.85rem; animation: fadeIn 0.3s;
}

#top-stats {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 24px; font-size: 0.9rem; z-index: 10;
  background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 8px;
}

#death-screen {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7); z-index: 20; font-size: 2rem;
  flex-direction: column; gap: 10px;
}
#death-screen .sub { font-size: 1rem; color: #aaa; }

#instructions {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  font-size: 0.75rem; color: rgba(255,255,255,0.4); z-index: 10;
  pointer-events: none; text-align: center;
}

@keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>

<div id="lobby">
  <h1>🎯 3D SHOOTER</h1>
  <p class="sub">Multiplayer arena shooter</p>
  <input id="name-input" type="text" placeholder="Enter your name" maxlength="16" autofocus>
  <button id="join-btn">JOIN GAME</button>
  <p style="margin-top:12px;font-size:0.8rem;color:#666;">Click canvas to lock mouse after joining</p>
</div>

<div id="hud">
  <div id="crosshair"><div class="dot"></div></div>

  <div id="health-text">HP</div>
  <div id="health-bar"><div id="health-fill"></div></div>

  <div id="top-stats">
    <span id="stat-kills">Kills: 0</span>
    <span id="stat-deaths">Deaths: 0</span>
  </div>

  <div id="kill-feed"></div>
  <div id="instructions">WASD move &bull; Mouse aim &bull; Click shoot &bull; TAB scoreboard</div>

  <div id="death-screen">
    <div>☠ YOU DIED</div>
    <div class="sub">Respawning in <span id="respawn-timer">3</span>s</div>
  </div>

  <div id="scoreboard">
    <h2>SCOREBOARD</h2>
    <table>
      <thead><tr><th>Player</th><th>Kills</th><th>Deaths</th></tr></thead>
      <tbody id="score-body"></tbody>
    </table>
    <p style="text-align:center;margin-top:10px;font-size:0.75rem;color:#666;">Press TAB to close</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="client.js"></script>
</body>
</html>
